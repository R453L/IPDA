name: Hadith Bot

on:
  workflow_dispatch:
    inputs:
      count:
        description: "কয়টা পোস্ট"
        default: "1"

permissions:
  contents: write

concurrency:
  group: hadith-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
      REVIEW_MODE: "1"
      COUNT: ${{ github.event.inputs.count || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright pillow
      - run: playwright install --with-deps chromium
      - run: python bot.py
      - name: Save posted list
        if: always()
        run: |
          git config user.name "hadith-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f posted.json ]; then git add posted.json; fi
          git diff --cached --quiet || (git commit -m "update posted list" && git pull --rebase && git push)
